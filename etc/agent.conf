<agent_config>

  <!-- Shared agent configuration pushed from manager to all Windows agents -->

  <!-- Suricata EVE JSON log collection (absolute path for installed agent) -->
  <localfile>
    <log_format>json</log_format>
    <location>C:\Program Files (x86)\monitoring-agent\suricata\log\eve.json</location>
  </localfile>

  <!-- ClamAV scan log collection (absolute path for installed agent) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>C:\Program Files (x86)\monitoring-agent\clamav\logs\clamscan.log</location>
  </localfile>

  <!-- Centrally managed Windows Event Log collection
       NOTE: Uses eventlog format (legacy) instead of eventchannel for broader
       compatibility. Switch back to eventchannel if using XPath queries. -->
  <localfile>
    <location>Application</location>
    <log_format>eventlog</log_format>
  </localfile>

  <localfile>
    <location>Security</location>
    <log_format>eventlog</log_format>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventlog</log_format>
  </localfile>

</agent_config>
