<!-- 
  ClamAV Log Monitoring Configuration for Windows Agent
  Add this configuration to the Windows agent's ossec.conf file within the <ossec_config> tags
  to enable ClamAV log monitoring and alert generation.
  
  Path: C:\Program Files\monitoring-agent\clamav\logs\clamscan.log
-->

<!-- ClamAV Scan Log Monitoring -->
<localfile>
  <location>C:\Program Files\monitoring-agent\clamav\logs\clamscan.log</location>
  <log_format>syslog</log_format>
  <label key="log_type">clamav</label>
</localfile>

<!-- ClamAV Database Update Log Monitoring -->
<localfile>
  <location>C:\Program Files\monitoring-agent\clamav\logs\freshclam.log</location>
  <log_format>syslog</log_format>
  <label key="log_type">freshclam</label>
</localfile>
